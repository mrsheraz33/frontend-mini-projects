<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="image/ai.png" type="image/x-icon">
</head>

<body>

    <div class="chat-container">
        <div class="ai-chat-box">
            <img src="image/ai.png" alt="" id="aiimage" width="10%">
            <div class="ai-chat-area">
                Hello ! How Can I Help You Today?
            </div>
        </div>
    </div>

    <div class="prompt-area">
        <input type="text" id="prompt" placeholder="Message...">
        <button id="image"><img src="img.svg" alt=""><input type="file" accept="images/*" hidden></button>
        <button id="submit"><img src="sumbit.svg" alt=""></button>
    </div>



    <script src="main.js"></script>
</body>

</html>
